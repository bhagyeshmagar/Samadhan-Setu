name: Samadhan Setu CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-test:
    name: Backend Lint, Migrations & Integration Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: samadhan_setu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio httpx
          pip install -r backend/requirements.txt

      - name: Code Quality & Undefined Names Lint (Ruff)
        run: |
          ruff check backend/app --select E,F,W --ignore E501

      - name: Run Alembic Database Migrations
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/samadhan_setu_test
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/samadhan_setu_test
          ENVIRONMENT: development
          ALLOW_INSECURE_DEV: "1"
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Suite
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/samadhan_setu_test
          DATABASE_URL: postgresql+asyncpg://postgres:testpassword@localhost:5432/samadhan_setu_test
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/samadhan_setu_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: development
          ALLOW_INSECURE_DEV: "1"
        run: |
          cd backend
          pytest -v
