version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: samadhan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: samadhan_setu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samadhan_setu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: samadhan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samadhan_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@db:5432/samadhan_setu
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/samadhan_setu
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-samadhan-setu-super-secure-production-secret-key-32chars}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      TRUSTED_PROXY_IPS: 127.0.0.1,::1
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/backend/uploads

volumes:
  pgdata:
  redisdata:
  uploads_data:
